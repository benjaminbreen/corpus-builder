    title: A Pluralistic Universe
    author: William James
    year: 1909
    language_code: en
    source_url: https://www.gutenberg.org/ebooks/11984
    summary: >
      James frames "computing" as one faculty among many for judging rationality, contrasting mechanical,
      moral, and practical forms of reason. Useful for treating computation as a cultural disposition
      rather than a purely technical act.
